<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MapperOss</title>

<style>
    /* 2. Set the map size. Without a height, the map will be invisible! */
    html { height: 100% }
    body { height: 100%; margin: 0; padding: 0 }
    #map { height: 100%}
</style>

    <!-- Include Leaflet CSS for map styling -->
    <link rel="stylesheet" href="scripts/leaflet/dist/leaflet.css" />
    <!--link type="text/css" rel="stylesheet" href="https://api.mqcdn.com/sdk/mapquest-js/v1.3.2/mapquest.css"/-->
    <link rel="stylesheet" href="mapperLeaflet.css" />
    <link rel="stylesheet" href="scripts/bbecquet/LeafletMagnifyingGlass/Control.MagnifyingGlass.css" />

<script type="text/javascript">
        window.onload = function() {
        console.log("window loaded, calling 'onLoad()'");
        onLoad();
        }
    </script></head>
<body>

    <!--h1>My OpenStreetMap Layer</h1-->

    <!-- The placeholder element where the map will appear -->
    <div id="map"></div>

    <script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.js?features=default"></script>
    <script type="text/javascript" src="qwebchannel.js"> </script>
    <script type="text/javascript" src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script type="text/javascript" src="mapperLeaflet.js"> </script>
    <script type="text/javascript" src="apikey.js"> </script>
    <script type="text/javascript" src="WebChannel.js"> </script>

    <!-- Include Leaflet JavaScript library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <script type="text/javascript"  src="https://unpkg.com/leaflet.vectorgrid@1.2.0"></script>
    <!-- font awsome & beautiful icon stuff -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
          rel="stylesheet">
    <link rel="stylesheet" href="scripts/masajid390/leaflet-beautify-marker-icon.css"/>

    <script type="text/javascript" src="scripts/leaflet.polylineoffset.js"></script>
    <link rel="stylesheet" href="scripts/bbecquet/LeafletMagnifyingGlass/leaflet.magnifyingglass.css">

    <script type="text/javascript" src="scripts/bbecquet/LeafletMagnifyingGlass/Control.MagnifyingGlass.js"></script>

    </script>
